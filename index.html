<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#bcd98f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mini Motorway X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6f3ea'/%3E%3Cpath d='M4 25C4 14 14 19 16 13S22 7 28 7' stroke='%238e9bb0' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Crect x='3' y='21' width='9' height='9' rx='3' fill='%234c8dff'/%3E%3Crect x='19' y='2' width='11' height='11' rx='3' fill='%234c8dff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="pill score-pill">
        <div class="score-num" id="score">0</div>
        <div class="score-sub"><span>送達</span><span id="best">最高 0</span></div>
      </div>

      <div class="pill week-pill">
        <div class="week-top"><b id="weekName">第 1 週</b><span id="dayName">週一</span></div>
        <div class="week-bar"><i id="weekFill"></i></div>
      </div>

      <div class="hud-btns">
        <button class="icon-btn" id="btnFit" title="回到完整地圖 (0)" aria-label="回到完整地圖" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="2.2" class="fill"/></svg>
        </button>
        <button class="icon-btn" id="btnPause" title="暫停 (空白鍵)" aria-label="暫停">
          <svg viewBox="0 0 24 24"><path id="pauseIcon" d="M8 5v14M16 5v14"/></svg>
        </button>
        <button class="icon-btn txt" id="btnSpeed" title="遊戲速度" aria-label="速度">1×</button>
        <button class="icon-btn" id="btnFull" title="全螢幕" aria-label="全螢幕">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="btnSound" title="音效" aria-label="音效">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" class="fill"/><path id="soundWaves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="icon-btn" id="btnRestart" title="重新開始" aria-label="重新開始">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
    </main>

    <nav id="toolbar">
      <button class="tool active" data-tool="road" title="道路 (1)">
        <svg viewBox="0 0 32 32"><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="stroke-thick g"/><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="dash"/></svg>
        <span>道路</span>
      </button>
      <button class="tool locked" data-tool="hw" title="高速公路 (2)">
        <svg viewBox="0 0 32 32"><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="stroke-thick o"/><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="dash"/></svg>
        <span>高速</span><em class="badge" id="cntHw">0</em>
      </button>
      <button class="tool locked" data-tool="wide" title="四線道 (3):把道路拓寬,通行量約 1.7 倍">
        <svg viewBox="0 0 32 32"><rect x="7" y="2" width="18" height="28" rx="3" fill="#767d89" stroke="#fff" stroke-width="1.6"/><path d="M15.2 3V29M16.8 3V29" stroke="#f0c52f" stroke-width="1.3"/><path d="M11.4 4V28M20.6 4V28" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 3"/></svg>
        <span>四線道</span><em class="badge" id="cntWide">0</em>
      </button>
      <button class="tool locked" data-tool="light" title="紅綠燈 (4)">
        <svg viewBox="0 0 32 32"><rect x="10" y="3" width="12" height="26" rx="6" class="fill dark"/><circle cx="16" cy="9.5" r="2.8" fill="#ff5a5a"/><circle cx="16" cy="16" r="2.8" fill="#ffd24d"/><circle cx="16" cy="22.5" r="2.8" fill="#58e08a"/></svg>
        <span>紅綠燈</span><em class="badge" id="cntLight">0</em>
      </button>
      <button class="tool locked" data-tool="round" title="圓環 (5)">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9.5" class="stroke-thick g"/><circle cx="16" cy="16" r="3" fill="#9fd3a8"/></svg>
        <span>圓環</span><em class="badge" id="cntRound">0</em>
      </button>
      <button class="tool locked" data-tool="ovp" title="高架 (6)">
        <svg viewBox="0 0 32 32"><path d="M3 21H29" class="stroke-thick g"/><path d="M16 2V30" stroke="#56637a" stroke-width="10"/><path d="M16 2V30" stroke="#b4bfd1" stroke-width="6.5"/><path d="M16 5V27" stroke="#fff" stroke-width="1.3" stroke-dasharray="2.5 3"/></svg>
        <span>高架</span><em class="badge" id="cntOvp">0</em>
      </button>
      <button class="tool locked" data-tool="tun" title="隧道 (7):從入口拖到出口">
        <svg viewBox="0 0 32 32"><path d="M4 28V16a12 12 0 0 1 24 0v12z" fill="#8e9bb0" stroke="none"/><path d="M11 28v-8a5 5 0 0 1 10 0v8z" fill="#2f3643" stroke="none"/></svg>
        <span>隧道</span><em class="badge" id="cntTun">0</em>
      </button>
      <button class="tool" data-tool="erase" title="橡皮擦 (8 / 右鍵拖曳)">
        <svg viewBox="0 0 32 32"><path d="M6 21l11-12 8 7-6 7H10z" class="fill pink"/><path d="M19 23h8" class="stroke"/></svg>
        <span>橡皮擦</span>
      </button>
      <div class="chip" id="bridgeChip" title="橋樑:道路跨越水面時使用">
        <svg viewBox="0 0 32 32"><path d="M3 20h26M7 20v-6M25 20v-6M7 14c4 0 5 4 9 4s5-4 9-4" class="stroke"/></svg>
        <b id="cntBridge">0</b>
      </div>
    </nav>

    <div id="modal" class="hidden">
      <div class="card" id="card"></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
