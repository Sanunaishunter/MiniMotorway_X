<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#bcd98f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mini Motorway X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6f3ea'/%3E%3Cpath d='M4 25C4 14 14 19 16 13S22 7 28 7' stroke='%238e9bb0' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Crect x='3' y='21' width='9' height='9' rx='3' fill='%234c8dff'/%3E%3Crect x='19' y='2' width='11' height='11' rx='3' fill='%234c8dff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="pill score-pill">
        <div class="score-num" id="score">0</div>
        <div class="score-sub"><span>送達</span><span id="best">最高 0</span></div>
      </div>

      <div class="pill week-pill">
        <div class="week-top"><b id="weekName">第 1 週</b><span id="dayName">週一</span></div>
        <div class="week-bar"><i id="weekFill"></i></div>
      </div>

      <div class="hud-btns">
        <button class="icon-btn" id="btnFit" title="回到完整地圖 (0)" aria-label="回到完整地圖" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="2.2" class="fill"/></svg>
        </button>
        <div class="mode-pill" id="modePill" style="display:none" role="status">
          <svg id="icoFly" viewBox="0 0 24 24"><path d="M21 3L3 10.5l6.5 2.5L12 20z" class="fill"/><path d="M9.5 13L21 3"/></svg>
          <svg id="icoFuji" viewBox="0 0 24 24" style="display:none"><path d="M4 6l6 6-6 6M12 6l6 6-6 6"/></svg>
          <span id="modeName">起飛啦</span><b id="modeLeft"></b>
        </div>
        <button class="icon-btn" id="btnPause" title="暫停 (空白鍵)" aria-label="暫停">
          <svg viewBox="0 0 24 24"><path id="pauseIcon" d="M8 5v14M16 5v14"/></svg>
        </button>
        <button class="icon-btn txt" id="btnSpeed" title="遊戲速度" aria-label="速度">1×</button>
        <button class="icon-btn" id="btnTime" title="晝夜:晝夜交替" aria-label="晝夜">
          <svg viewBox="0 0 24 24"><g id="icoDay"><circle cx="12" cy="12" r="4.2" class="fill"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g><path id="icoNight" class="fill" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/><g id="icoCycle"><path d="M12 3a9 9 0 1 0 0 18z" class="fill"/><circle cx="12" cy="12" r="9"/></g></svg>
        </button>
        <button class="icon-btn" id="btnMap" title="地圖:雪國" aria-label="地圖">
          <svg viewBox="0 0 24 24"><g id="icoSnow"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.6L12 6.6l2.5-2M9.5 19.4l2.5-2 2.5 2"/></g><g id="icoRandom"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.2" class="fill"/><circle cx="15" cy="15" r="1.2" class="fill"/><circle cx="15" cy="9" r="1.2" class="fill"/><circle cx="9" cy="15" r="1.2" class="fill"/></g><g id="icoBeach"><path d="M3 15c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 20c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><circle cx="16.5" cy="7" r="2.6"/></g><g id="icoForest"><path d="M12 3l5.5 7.5h-3L19 17H5l4.5-6.5h-3z"/><path d="M12 17v4"/></g></svg>
        </button>
        <button class="icon-btn" id="btnFull" title="全螢幕" aria-label="全螢幕">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="btnSound" title="音效" aria-label="音效">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" class="fill"/><path id="soundWaves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="icon-btn" id="btnRestart" title="重新開始" aria-label="重新開始">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
      <div id="mayorBar" class="hidden">
        <span id="mayorText"></span>
        <button class="btn" id="mayorDone" type="button">改好了,開始無敵時間</button>
      </div>
    </main>

    <nav id="toolbar">
      <button class="tool active" data-tool="road" title="道路 (1)">
        <svg viewBox="0 0 32 32"><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="stroke-thick g"/><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="dash"/></svg>
        <span>道路</span>
      </button>
      <button class="tool locked" data-tool="hw" title="高速公路 (2)">
        <svg viewBox="0 0 32 32"><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="stroke-thick o"/><path d="M5 26C5 14 14 20 16 14S22 6 27 6" class="dash"/></svg>
        <span>高速</span><em class="badge" id="cntHw">0</em>
      </button>
      <button class="tool locked" data-tool="wide" title="四線道 (3):把道路拓寬,通行量約 1.7 倍">
        <svg viewBox="0 0 32 32"><rect x="7" y="2" width="18" height="28" rx="3" fill="#767d89" stroke="#fff" stroke-width="1.6"/><path d="M15.2 3V29M16.8 3V29" stroke="#f0c52f" stroke-width="1.3"/><path d="M11.4 4V28M20.6 4V28" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 3"/></svg>
        <span>四線道</span><em class="badge" id="cntWide">0</em>
      </button>
      <button class="tool locked" data-tool="light" title="紅綠燈 (4)">
        <svg viewBox="0 0 32 32"><rect x="10" y="3" width="12" height="26" rx="6" class="fill dark"/><circle cx="16" cy="9.5" r="2.8" fill="#ff5a5a"/><circle cx="16" cy="16" r="2.8" fill="#ffd24d"/><circle cx="16" cy="22.5" r="2.8" fill="#58e08a"/></svg>
        <span>紅綠燈</span><em class="badge" id="cntLight">0</em>
      </button>
      <button class="tool locked" data-tool="round" title="圓環 (5)">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9.5" class="stroke-thick g"/><circle cx="16" cy="16" r="3" fill="#9fd3a8"/></svg>
        <span>圓環</span><em class="badge" id="cntRound">0</em>
      </button>
      <button class="tool locked" data-tool="ovp" title="高架 (6)">
        <svg viewBox="0 0 32 32"><path d="M3 21H29" class="stroke-thick g"/><path d="M16 2V30" stroke="#56637a" stroke-width="10"/><path d="M16 2V30" stroke="#b4bfd1" stroke-width="6.5"/><path d="M16 5V27" stroke="#fff" stroke-width="1.3" stroke-dasharray="2.5 3"/></svg>
        <span>高架</span><em class="badge" id="cntOvp">0</em>
      </button>
      <button class="tool locked" data-tool="tun" title="隧道 (7):從入口拖到出口">
        <svg viewBox="0 0 32 32"><path d="M4 28V16a12 12 0 0 1 24 0v12z" fill="#8e9bb0" stroke="none"/><path d="M11 28v-8a5 5 0 0 1 10 0v8z" fill="#2f3643" stroke="none"/></svg>
        <span>隧道</span><em class="badge" id="cntTun">0</em>
      </button>
      <button class="tool locked" data-tool="mega" title="超大圓環:3×3 格的單向四線道圓環,點一下放在想要的位置(清掉範圍內原本的路)">
        <svg viewBox="0 0 32 32"><rect x="3.5" y="3.5" width="25" height="25" rx="9" fill="none" stroke="#8e9bb0" stroke-width="6.5"/><rect x="10" y="10" width="12" height="12" rx="4" fill="#9fd3a8" stroke="none"/></svg>
        <span>超大圓環</span><em class="badge" id="cntMega">0</em>
      </button>
      <button class="tool locked" data-tool="tp" title="傳送門 (9):依序點兩個路的盡頭,車子進其中一扇就從另一扇出來(雙向)">
        <svg viewBox="0 0 32 32" id="icoTp"></svg>
        <span>傳送門</span><em class="badge" id="cntTp">0</em>
      </button>
      <button class="tool locked sea" data-tool="sea" title="摩西分海:只把產車的小房子分到左右兩邊,同顏色排在一起(目的地、道路、地圖都不動)">
        <svg viewBox="0 0 32 32"><path d="M3 5c5 3 7 6 7 11s-2 8-7 11z" fill="#6cb8f0" stroke="#2f7cb8" stroke-width="1.4"/><path d="M29 5c-5 3-7 6-7 11s2 8 7 11z" fill="#6cb8f0" stroke="#2f7cb8" stroke-width="1.4"/><path d="M16 4v24" stroke="#d9c58c" stroke-width="6" stroke-dasharray="3 3" fill="none"/></svg>
        <span>摩西分海</span><em class="badge" id="cntSea">0</em>
      </button>
      <button class="tool locked nuke" data-tool="nuke" title="超級原子彈:一次抹除整張地圖的道路(Kayray 的祝福送的,一次一顆)">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="3" fill="#2f3a4b" stroke="none"/><path d="M16 13V4.5a11.5 11.5 0 0 1 9.96 5.75L18.6 14.5A3 3 0 0 0 16 13z" fill="#ffd23f" stroke="#2f3a4b" stroke-width="1.4"/><path d="M18.6 17.5l7.36 4.25A11.5 11.5 0 0 1 16 27.5V19a3 3 0 0 0 2.6-1.5z" fill="#ffd23f" stroke="#2f3a4b" stroke-width="1.4"/><path d="M13.4 17.5A3 3 0 0 0 16 19v8.5a11.5 11.5 0 0 1-9.96-5.75z" fill="#ffd23f" stroke="#2f3a4b" stroke-width="1.4"/><path d="M13.4 14.5L6.04 10.25A11.5 11.5 0 0 1 16 4.5V13a3 3 0 0 0-2.6 1.5z" fill="#ffd23f" stroke="#2f3a4b" stroke-width="1.4"/></svg>
        <span>原子彈</span><em class="badge" id="cntNuke">0</em>
      </button>
      <button class="tool locked nuke" data-tool="hand" title="天神之手:點一棟房子或目的地拿起來,再點空地放下(Kayray 的祝福送的,不會用完)">
        <svg viewBox="0 0 32 32"><path d="M11 17V8.5a1.8 1.8 0 0 1 3.6 0V15M14.6 14V6.5a1.8 1.8 0 0 1 3.6 0V14M18.2 14.5V8a1.8 1.8 0 0 1 3.6 0v8M21.8 12.5a1.8 1.8 0 0 1 3.6 0V20c0 4.4-3 7.5-7.4 7.5h-1.6c-3 0-4.6-1.4-6-3.6L7.4 19c-.8-1.4.9-2.9 2.3-1.8L11 18.4" fill="#ffe08a"/></svg>
        <span>天神之手</span><em class="badge" id="cntHand">∞</em>
      </button>
      <button class="tool" data-tool="erase" title="橡皮擦 (8 / 右鍵拖曳)">
        <svg viewBox="0 0 32 32"><path d="M6 21l11-12 8 7-6 7H10z" class="fill pink"/><path d="M19 23h8" class="stroke"/></svg>
        <span>橡皮擦</span>
      </button>
    </nav>

    <div id="modal" class="hidden">
      <div class="card" id="card"></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/police.js"></script>
  <script src="js/planes.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
